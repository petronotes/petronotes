name: Build LifeSync APK

on:
  push:
    branches: [lifesync-android]
    paths:
      - 'lifesync-src/**'
      - '.github/workflows/build-lifesync.yml'
      - 'LIFESYNC_README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Reconstruct and verify source project
        shell: bash
        run: |
          cat lifesync-src/*.part | base64 -d > /tmp/lifesync-source.tar.gz
          echo "c863df32788be82b251c5fde6f2b908772055e8f0ff52cb56866f3b934c6e3b4  /tmp/lifesync-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/lifesync-source.tar.gz
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          sed -i 's/version "8.7.3"/version "8.10.1"/' build.gradle.kts
          sed -i 's/compileSdk = 35/compileSdk = 36/' app/build.gradle.kts
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
      - name: Android Platform 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Configure Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeSync-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14